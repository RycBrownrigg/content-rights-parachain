[package]
name = "pallet-content-rights"
description = "Content rights management pallet with RMRK-inspired nesting on pallet-nfts."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame = { workspace = true, features = ["experimental", "runtime"], default-features = false }
scale-info = { features = ["derive"], workspace = true }
polkadot-sdk = { workspace = true, features = ["pallet-nfts", "pallet-balances"], default-features = false }

[features]
default = ["std"]
runtime-benchmarks = ["frame/runtime-benchmarks", "polkadot-sdk/runtime-benchmarks"]
std = ["codec/std", "frame/std", "scale-info/std", "polkadot-sdk/std"]
try-runtime = ["frame/try-runtime"]
