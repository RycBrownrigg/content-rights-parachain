[settings]
node_verifier = "None"
prometheus = true

# Paths are relative to this config file's directory (repo root).
# Requires: polkadot-sdk/ and zombienet/ inside this repo. Build polkadot first:
#   cd polkadot-sdk && cargo build --release -p polkadot
# See POLKADOT-WORKERS-FIX.md for details.
[relaychain]
default_command = "polkadot-sdk/target/release/polkadot"
default_args = [ "-lparachain=debug", "--rpc-external", "--workers-path", "polkadot-sdk/target/release" ]
chain = "rococo-local"

[[relaychain.nodes]]
name = "alice"

[[relaychain.nodes]]
name = "bob"

[[parachains]]
id = 100
# chain = "local" so Zombienet runs build-spec --chain local (template supports "local").
# Without it, Zombienet passes undefined and build-spec fails with "undefined-plain.json".
chain = "local"
command = "target/release/parachain-template-node"
args = [
  "--rpc-external",
  "--unsafe-rpc-external",
  "--force-authoring"
]
# Note: --rpc-cors and --rpc-methods are added automatically by zombienet
name = "content-rights-parachain"

# Use a fixed RPC port so you know which endpoint is the PARACHAIN (not the relay).
# Connect to ws://127.0.0.1:9990 in Polkadot.js Apps to see Chain State (including "contracts").
# Using 9990 so a fresh spawn is clearly on a port nothing else used.
# command here is required: Zombienet uses the collator's command, not the parachain-level one.
# Without it, Zombienet runs "polkadot-parachain" (default) instead of our binary.
[[parachains.collators]]
name = "collator01"
command = "target/release/parachain-template-node"
rpc_port = 9990
ws_port = 9990
args = [
  "--rpc-external",
  "--unsafe-rpc-external",
  "--force-authoring"
]
# Note: --rpc-cors and --rpc-methods are added automatically by zombienet
