[workspace.package]
license = "MIT-0"
authors = ["Parity Technologies <admin@parity.io>"]
homepage = "https://paritytech.github.io/polkadot-sdk/"
repository = "https://github.com/paritytech/polkadot-sdk-parachain-template.git"
edition = "2021"

[workspace]
default-members = ["pallets/template", "pallets/content-rights", "pallets/rights-verifier", "runtime"]
members = [
    "node",
    "pallets/template",
    "pallets/content-rights",
    "pallets/rights-verifier",
    "runtime",
    "integration-tests",
]
resolver = "2"
exclude = ["contracts/rights_manager"]

[workspace.dependencies]
parachain-template-runtime = { path = "./runtime", default-features = false }
pallet-parachain-template = { path = "./pallets/template", default-features = false }
pallet-content-rights = { path = "./pallets/content-rights", default-features = false }
pallet-rights-verifier = { path = "./pallets/rights-verifier", default-features = false }
clap = { version = "4.5.13" }
color-print = { version = "0.3.4" }
docify = { version = "0.2.9" }
futures = { version = "0.3.31" }
jsonrpsee = { version = "0.24.3" }
log = { version = "0.4.22", default-features = false }
# Use git to get pallet-revive with the API that cargo-contract 6 / ink! 6 expect.
# Pin to a specific rev for reproducible builds (e.g. replace with a recent tag/rev).
polkadot-sdk = { git = "https://github.com/paritytech/polkadot-sdk.git", default-features = false }
prometheus-endpoint = { version = "0.17.2", default-features = false, package = "substrate-prometheus-endpoint" }
serde = { version = "1.0.214", default-features = false }
codec = { version = "3.7.4", default-features = false, package = "parity-scale-codec" }
# Use the same cumulus-pallet-parachain-system as the git polkadot-sdk to avoid mixing
# registry and git versions (which can lead to duplicate `sp_io`).
cumulus-pallet-parachain-system = { package = "cumulus-pallet-parachain-system", git = "https://github.com/paritytech/polkadot-sdk.git", default-features = false }
hex-literal = { version = "0.4.1", default-features = false }
scale-info = { version = "2.11.6", default-features = false }
serde_json = { version = "1.0.132", default-features = false }
smallvec = { version = "1.11.0", default-features = false }
substrate-wasm-builder = { version = "26.0.1", default-features = false }
frame = { package = "polkadot-sdk-frame", git = "https://github.com/paritytech/polkadot-sdk.git", default-features = false }
xcm-simulator = { git = "https://github.com/paritytech/polkadot-sdk.git", default-features = false }

[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true

