# Zombienet config for Snowbridge local bridge simulation.
# Spawns 4 chains: Rococo relay, Bridge Hub (1013), AssetHub (1000), Content Rights (100).
#
# Requires pre-built binaries:
#   polkadot-sdk/target/release/polkadot          (with --features fast-runtime)
#   polkadot-sdk/target/release/polkadot-prepare-worker
#   polkadot-sdk/target/release/polkadot-execute-worker
#   polkadot-sdk/target/release/polkadot-parachain
#   target/release/parachain-template-node
#
# Usage:
#   ./zombienet-spawn.sh zombienet-snowbridge.toml --provider native
#
# HRMP channels must be opened post-launch via sudo extrinsics:
#   Bridge Hub (1013) ↔ AssetHub (1000)  — Snowbridge message routing
#   AssetHub (1000) ↔ Content Rights (100) — forwarding bridged tokens

[settings]
node_verifier = "None"
prometheus = true
node_spawn_timeout = 240

# ─── Relay Chain (Rococo-local) ───────────────────────────────────────────────

[relaychain]
default_command = "polkadot-sdk/target/release/polkadot"
default_args = [
  "-lparachain=debug,xcm=trace",
  "--rpc-external",
  "--workers-path", "polkadot-sdk/target/release"
]
chain = "rococo-local"

[[relaychain.nodes]]
name = "alice"
balance = 2000000000000

[[relaychain.nodes]]
name = "bob"
balance = 2000000000000

# ─── Bridge Hub (para 1013) ───────────────────────────────────────────────────

[[parachains]]
id = 1013
chain = "bridge-hub-rococo-local"
cumulus_based = true

[[parachains.collators]]
name = "bridge-hub-collator"
command = "polkadot-sdk/target/release/polkadot-parachain"
rpc_port = 8943
ws_port = 8943
args = [
  "--rpc-external",
  "--unsafe-rpc-external",
  "--force-authoring",
  "-lparachain=debug,runtime::bridge=trace,xcm=trace"
]

# ─── AssetHub (para 1000) ────────────────────────────────────────────────────

[[parachains]]
id = 1000
chain = "asset-hub-rococo-local"
cumulus_based = true

[[parachains.collators]]
name = "asset-hub-collator"
command = "polkadot-sdk/target/release/polkadot-parachain"
rpc_port = 9910
ws_port = 9910
args = [
  "--rpc-external",
  "--unsafe-rpc-external",
  "--force-authoring",
  "-lparachain=debug,xcm=trace,runtime::bridge=trace"
]

# ─── Content Rights (para 100) ───────────────────────────────────────────────

[[parachains]]
id = 100
chain = "local"
command = "target/release/parachain-template-node"
args = ["--rpc-external", "--unsafe-rpc-external", "--force-authoring"]
name = "content-rights-parachain"

[[parachains.collators]]
name = "content-rights-collator"
command = "target/release/parachain-template-node"
rpc_port = 9990
ws_port = 9990
args = [
  "--rpc-external",
  "--unsafe-rpc-external",
  "--force-authoring",
  "-lxcm=trace,xcm::process-message=trace,xcm::fungible_adapter=trace"
]
